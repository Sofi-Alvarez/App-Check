sans-serif">5 min</text><rect x="164" y="223" width="76" height="48" rx="24" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="202" y="252" font-size="14" font-weight="700" fill="#E6EEE9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">10 min</text><rect x="248" y="223" width="76" height="48" rx="24" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="286" y="252" font-size="14" font-weight="700" fill="#E6EEE9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">15 min</text><text x="32" y="296.75" font-size="15" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Mantener la pantalla encendida</text><text x="32" y="317.75" font-size="15" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">mientras la app está abierta</text><rect x="312" y="288" width="46" height="28" rx="14" fill="#2B3832"/><circle cx="326" cy="302" r="11" fill="#16201B"/><rect x="16" y="355" width="358" height="345" rx="16" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="32" y="383" font-size="12" font-weight="700" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.1">PERMISOS</text><text x="32" y="412.75" font-size="15" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Avisos programados (próximos 14 días): 112</text><text x="32" y="442.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Último reprogramado: 112 de 112 avisos, sin</text><text x="32" y="462.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">errores.</text><text x="32" y="496" font-size="15" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Notificaciones</text><text x="358" y="496" font-size="15" font-weight="700" fill="#5BD08F" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Activadas</text><text x="32" y="530" font-size="15" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Alarmas exactas</text><text x="358" y="530" font-size="15" font-weight="700" fill="#5BD08F" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Activadas</text><text x="32" y="560.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sin este permiso los avisos pueden llegar con</text><text x="32" y="580.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">minutos de atraso. Al tocar el botón se abre</text><text x="32" y="600.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">la pantalla de alarmas y recordatorios: activa</text><text x="32" y="620.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">la app ahí.</text><rect x="32" y="636" width="326" height="48" rx="12" fill="#1F2B25"/><text x="195" y="666" font-size="16" font-weight="700" fill="#E6EEE9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Probar aviso en 5 segundos</text><rect x="16" y="716" width="358" height="406" rx="16" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="32" y="744" font-size="12" font-weight="700" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.1">PARA QUE NO SE PIERDAN EN TU XIAOMI</text><text x="32" y="772.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">HyperOS cierra las apps en segundo plano para</text><text x="32" y="792.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ahorrar batería y eso cancela los avisos. Haz</text><text x="32" y="812.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">esto una sola vez:</text><text x="32" y="842.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1. Inicio automático: actívalo para esta app.</text><text x="32" y="872.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">2. Ahorro de batería: elige “Sin</text><text x="32" y="892.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">restricciones”.</text><text x="32" y="922.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">3. Notificaciones: permite todas, incluidas</text><text x="32" y="942.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">las de pantalla de bloqueo.</text><text x="32" y="972.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">4. En Recientes, mantén presionada la tarjeta</text><text x="32" y="992.9" font-size="14" font-weight="400" fill="#E6EEE9" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">de la app y toca el candado.</text><text x="32" y="1022.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Los nombres de los menús pueden variar según</text><text x="32" y="1042.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">tu versión.</text><rect x="32" y="1058" width="326" height="48" rx="12" fill="#8CAAFF"/><text x="195" y="1088" font-size="16" font-weight="700" fill="#0E1512" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Abrir ajustes de la app</text><rect x="16" y="1138" width="358" height="216" rx="16" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="32" y="1166" font-size="12" font-weight="700" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.1">COPIA DE SEGURIDAD</text><text x="32" y="1194.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Guarda todo lo de la app: la agenda con tus</text><text x="32" y="1214.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ediciones, lo hecho, los conteos, el registro</text><text x="32" y="1234.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">de sesiones y los ajustes. Compártela a tu</text><text x="32" y="1254.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">correo o a Drive. Si desinstalas la app, sin</text><text x="32" y="1274.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">esta copia se pierde todo.</text><rect x="32" y="1290" width="326" height="48" rx="12" fill="#8CAAFF"/><text x="195" y="1320" font-size="16" font-weight="700" fill="#0E1512" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Exportar copia de seguridad</text><rect x="16" y="1370" width="358" height="156" rx="16" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="32" y="1398" font-size="12" font-weight="700" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.1">CATEGORÍAS</text><text x="32" y="1426.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Crea, cambia de nombre o de color, archiva o</text><text x="32" y="1446.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">elimina las categorías de tus eventos.</text><rect x="32" y="1462" width="326" height="48" rx="12" fill="#8CAAFF"/><text x="195" y="1492" font-size="16" font-weight="700" fill="#0E1512" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Administrar categorías</text><rect x="16" y="1542" width="358" height="234" rx="16" fill="#16201B" stroke="#2B3832" stroke-width="1"/><text x="32" y="1570" font-size="12" font-weight="700" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.1">AGENDA</text><text x="32" y="1598.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Estas acciones cambian tu agenda, pero nunca</text><text x="32" y="1618.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">borran el registro de uso (Datos y CSV).</text><text x="32" y="1638.9" font-size="14" font-weight="400" fill="#9BA9A2" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Puedes deshacerlas durante 8 segundos.</text><rect x="32" y="1654" width="326" height="48" rx="12" fill="#1F2B25"/><text x="195" y="1684" font-size="16" font-weight="700" fill="#E6EEE9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Restaurar la plantilla inicial</text><rect x="32" y="1712" width="326" height="48" rx="12" fill="#1F2B25"/><text x="195" y="1742" font-size="16" font-weight="700" fill="#E6EEE9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Borrar toda la agenda</text></g>
